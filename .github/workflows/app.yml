# Bringt jede neue Version auf GitHub Pages und prüft die App danach mit echtem Chrome.
# Funktioniert mit beiden Pages-Quellen: „GitHub Actions“ (lädt die Spieldateien hoch) und
# „Deploy from a branch“ (fordert den Bau an – Pushes über die Claude-App stoßen ihn nicht von selbst an).
name: App veröffentlichen

on:
  push:
    branches: ['claude/friendly-hawking-yvuraw']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages-Einstellung lesen
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{build_type, source, html_url}'
          echo "build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)" >> "$GITHUB_OUTPUT"
      - name: Nur die Spieldateien
        run: |
          mkdir _site
          cp -r index.html style.css logos.js game.js manifest.webmanifest sw.js icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  branch-build:
    needs: build
    if: needs.build.outputs.build_type == 'legacy'
    runs-on: ubuntu-latest
    steps:
      - name: Pages-Bau anfordern und abwarten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
          for i in $(seq 1 36); do
            sleep 10
            read -r commit status < <(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"\(.commit) \(.status)"')
            echo "Pages: $status ($commit)"
            [ "$status" = errored ] && exit 1
            [ "$commit" = "${{ github.sha }}" ] && [ "$status" = built ] && exit 0
          done
          echo "Pages-Bau dauert zu lange"; exit 1

  check:
    needs: [deploy, branch-build]
    if: always() && (needs.deploy.result == 'success' || needs.branch-build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.56.1
      - name: App prüfen
        run: node .github/scripts/check-app.js https://6ktsvkrmmh-prog.github.io/nolimit/ "$(command -v google-chrome || command -v chromium)"
